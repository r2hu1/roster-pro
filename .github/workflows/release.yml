name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""

          - os: windows-latest
            args: ""

          - os: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: universal-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - name: Restore Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt update

          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web
        run: bun turbo build --filter=web

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/web/src-tauri
          args: ${{ matrix.args }}
          releaseId: ${{ github.event.release.id }}

  android:
    name: Android

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-android-${{ github.sha }}
          restore-keys: |
            turbo-android

      - uses: android-actions/setup-android@v3

      - name: Install Rust Targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web
        run: bun turbo build --filter=web

      - name: Build Android
        working-directory: apps/web
        run: bunx tauri android build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            apps/web/src-tauri/gen/android/app/build/outputs/**/*.apk
            apps/web/src-tauri/gen/android/app/build/outputs/**/*.aab
