name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    environment: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Web
      - name: Deploy Web
        working-directory: apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.WEB_PROJECT_ID }}
        run: |
          bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          bunx vercel build --prod --token=$VERCEL_TOKEN
          bunx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      # API
      - name: Deploy API
        working-directory: apps/api
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.API_PROJECT_ID }}
        run: |
          bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          bunx vercel build --prod --token=$VERCEL_TOKEN
          bunx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      # Marketing
      - name: Deploy Marketing
        working-directory: apps/marketing
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MARKETING_PROJECT_ID }}
        run: |
          bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          bunx vercel build --prod --token=$VERCEL_TOKEN
          bunx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

      # Client Web
      - name: Deploy Client Web
        working-directory: apps/client-web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.CLIENT_WEB_PROJECT_ID }}
        run: |
          bunx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          bunx vercel build --prod --token=$VERCEL_TOKEN
          bunx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
